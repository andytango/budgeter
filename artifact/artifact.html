<title>Budgeter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Condensed:wght@500;600;700;800&display=swap">
<meta name="theme-color" content="#dee8e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151d1c" media="(prefers-color-scheme: dark)">
<!-- Same code as the phone app: panel.css and panel.js are published from app/public/. -->
<link rel="stylesheet" href="panel.css">

<main class="panel" id="app"><p class="status">Loading…</p></main>

<script src="panel.js"></script>
<script>
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) { Budgeter.fail("Open this page in Claude to see the latest budget."); return; }
  db.doc("budget/current").onSnapshot(
    (snap) => { if (snap.exists) Budgeter.render(snap.data()); else Budgeter.fail("No budget saved yet. Claude fills this in each morning."); },
    () => Budgeter.fail("The budget couldn't be loaded. Reload the page to try again.")
  );
})();
</script>
