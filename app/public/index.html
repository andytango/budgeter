<body>
<main class="panel" id="app"><p class="status">Loading…</p></main>

<script src="/panel.js"></script>
<script src="/auth.js"></script>
<script>
document.addEventListener("gesturestart", (e) => e.preventDefault());
(function () {
  // All API calls go through api(): on Vercel + Supabase, auth.js adds the sign-in token.
  const Auth = window.BudgetAuth;
  const api = (path, opts = {}) => (Auth ? Auth.fetch : fetch)(path, Object.assign({ credentials: "same-origin" }, opts));
  async function load() {
    try {
      const res = await api("/api/budget", { cache: "no-store", headers: { Accept: "application/json" } });
      if (res.status === 401 && Auth) return Auth.signIn().then(load);
      const type = res.headers.get("content-type") || "";
      if (!res.ok || !type.includes("application/json")) throw new Error("signin");
      BudgetPanel.render(await res.json());
    } catch (e) {
      BudgetPanel.fail('Your sign-in has expired or you are offline. <a href="/" onclick="location.reload();return false">Tap to sign in again</a>.');
    }
  }
  // Refresh button: fetch the latest budget and check for a newer version of the app.
  BudgetPanel.onRefresh = async () => {
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
    await Promise.all([load(), reg ? reg.update().catch(() => {}) : null]);
  };
  // Push notifications (iOS: only once the app is on the Home Screen). The bell in the header
  // subscribes this phone; tapping it again sends a test notification.
  const pushOK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const keyBytes = (s) => Uint8Array.from(atob((s + "=".repeat((4 - (s.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  if (pushOK) {
    BudgetPanel.push = {
      state: Notification.permission === "denied" ? "denied" : "off",
      async toggle() {
        const push = BudgetPanel.push;
        // Ask first: iOS only shows the prompt straight from a tap.
        const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
        if (perm !== "granted") { push.state = "denied"; BudgetPanel.redraw(); return; }
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          const { key } = await (await api("/api/push/key")).json();
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) });
        }
        await post("/api/push/subscribe", sub.toJSON());
        push.state = "on";
        BudgetPanel.redraw();
        await post("/api/push/test", { endpoint: sub.endpoint });
      },
    };
    navigator.serviceWorker.ready.then((reg) => reg.pushManager.getSubscription()).then((sub) => {
      if (!sub || Notification.permission !== "granted") return;
      BudgetPanel.push.state = "on";
      BudgetPanel.redraw();
      post("/api/push/subscribe", sub.toJSON()).catch(() => {}); // keep the server's copy current
    }).catch(() => {});
  }
  (Auth ? Auth.ready() : Promise.resolve()).then(load);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
  if ("serviceWorker" in navigator) {
    // A newer app version took over (e.g. found by the refresh button): reload to run it.
    // Only when a worker was already in control, so the first install doesn't trigger a reload.
    if (navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
})();
</script>
